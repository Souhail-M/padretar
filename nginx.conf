server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy, which terminates TLS and forwards over HTTP.
    # Log the real client rather than the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # The QR scanner needs getUserMedia, which browsers expose only in a
    # secure context. Coolify's proxy provides the TLS; this header makes sure
    # nothing downstream strips the camera permission away.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # NOTE: a single `add_header` inside a location block discards *every*
    # add_header inherited from this server block — so the four security
    # headers above would silently vanish from any location that set its own.
    # Caching below is therefore expressed with `expires`, which does not
    # reset inherited headers.

    # Container health probe, polled by Coolify to decide a deploy succeeded.
    # Kept out of the access log: one hit every 15s otherwise drowns real
    # traffic.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed filenames — safe to cache for a year.
    location /assets/ {
        expires 1y;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to
    # the previous asset hashes.
    location = /index.html {
        expires -1;
    }

    # Single-page app: react-router owns the routes, so every unknown path
    # returns index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
