server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The QR scanner needs getUserMedia, which browsers only expose in a secure
    # context. Serve this behind TLS — over plain HTTP on anything other than
    # localhost the camera API is absent and employees fall back to typing the
    # code by hand.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: react-router owns the routes, so every unknown path
    # must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves clients
    # pinned to the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
