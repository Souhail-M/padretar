# Front only. The backend is Convex (hosted), so there is no API container and
# no database container here — the shop's data lives in the Convex deployment.
#
# There is deliberately no `build:` key. The image is built and pushed by
# .github/workflows/build-and-deploy.yml, and Coolify only pulls and runs it.
# Adding `build:` back would move the build onto the server again.
services:
  web:
    image: ghcr.io/souhail-m/padretar:latest
    # :latest is a moving tag, and Docker will happily reuse a local copy under
    # that name — a deploy then "succeeds" while still running the previous
    # build. Caught on KatabAI, where a green build kept serving the old image.
    pull_policy: always
    restart: unless-stopped

    # NOTE: no SERVICE_FQDN_WEB_80 here, on purpose.
    #
    # That magic variable does not read the configured domain — it *generates*
    # one. Each time Coolify re-parses a changed compose file it mints a fresh
    # random subdomain and overwrites the configured value, so the app silently
    # moves and the previous address starts answering "503 no available
    # server". Seen here: qlxgmo5nd… became xw6nc653… after a one-line compose
    # edit that had nothing to do with domains.
    #
    # The domain is set explicitly on the resource in Coolify instead, which
    # survives compose changes, and Coolify routes it to the port exposed
    # below. TLS terminates at Coolify's proxy — required for the QR scanner,
    # since getUserMedia only exists in a secure context.

    expose:
      - "80"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
